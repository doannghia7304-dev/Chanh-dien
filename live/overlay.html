<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay 9:16 · Chánh Điện Tịnh Tâm</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,500;0,700;1,400&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Overlay for TikTok LIVE Studio / OBS window capture. Everything sits on a 1080×1920 stage scaled to the window. */
:root{
  --bg:#0c0705; --fg:#f6e9cf; --muted:#c9ad84; --gold:#e2b04f; --gold2:#ffd98a; --red:#7e1d12;
  --panel:rgba(28,13,7,.8); --line:rgba(226,176,79,.55);
  --display:"Noto Serif",Georgia,serif; --body:"Be Vietnam Pro",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--body);color:var(--fg)}
#fit{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center;overflow:hidden;background:var(--bg)}
#c{position:absolute;inset:0;width:1080px;height:1920px}
.ui{position:absolute;z-index:3}
.panel{background:linear-gradient(180deg,rgba(48,21,8,.88),rgba(20,9,4,.88));border:2px solid var(--line);border-radius:20px;box-shadow:0 8px 28px rgba(0,0,0,.45)}
/* top-right: session countdown + offering counters (top-left belongs to TikTok's own header) */
#offer{right:22px;top:250px;width:300px;box-sizing:border-box;padding:14px 18px 12px}
#title{font-family:var(--display);font-weight:700;font-size:22px;color:var(--gold2);text-align:center;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#subtitle{font-family:var(--display);font-style:italic;font-size:18px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clock{font:700 60px/1 var(--body);text-align:center;font-variant-numeric:tabular-nums;color:#fff4dc;margin:10px 0 2px;text-shadow:0 0 18px rgba(255,200,110,.35)}
.lbl{font-size:17px;color:var(--muted);text-align:center;margin-bottom:8px;letter-spacing:.04em}
.cnt{display:flex;align-items:center;gap:12px;padding:5px 0;border-top:1px solid rgba(226,176,79,.22)}
.cnt img,.cnt .ic{width:44px;height:44px;object-fit:contain;flex:none}
.cnt .ic{display:grid;place-items:center;font-size:34px;line-height:1;color:#ff5a7a}
.cnt b{font:700 30px var(--body);font-variant-numeric:tabular-nums;min-width:66px;color:var(--gold2)}
.cnt span{font-size:21px;white-space:nowrap}
.cnt.bump b{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.3);color:#fff}}
#people{margin-top:6px;padding-top:8px;border-top:1px solid rgba(226,176,79,.22);text-align:center;font-size:20px}
#people b{color:var(--gold2);font-variant-numeric:tabular-nums}
/* bottom: latest offering, price legend, top donors */
#bar{left:18px;right:18px;bottom:22px;height:206px;display:grid;grid-template-columns:1fr 330px;gap:14px}
#left{display:grid;grid-template-rows:auto 1fr;gap:10px;min-width:0}
#ticker{justify-self:center;max-width:100%;box-sizing:border-box;font:600 28px var(--body);padding:8px 28px;border-radius:999px;background:rgba(20,9,4,.84);border:2px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ticker b{color:var(--gold2)}
#ticker i{font-style:normal;color:var(--fg);margin-left:12px;opacity:.85}
#ticker.flash{animation:flash 1.4s}
@keyframes flash{30%{box-shadow:0 0 34px rgba(255,200,100,.85);border-color:var(--gold2)}}
#legend{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lg{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 10px}
.lg img{width:60px;height:60px;object-fit:contain}
.lg div{display:grid;line-height:1.2}
.lg small{font:700 18px var(--body);color:var(--gold2);letter-spacing:.05em}
.lg span{font-size:22px;font-weight:600;white-space:nowrap}
#board{padding:12px 16px}
#board h3{margin:0 0 8px;text-align:center;font:700 24px var(--display);letter-spacing:.08em;color:var(--gold2)}
#board ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
#board li{display:grid;grid-template-columns:30px 1fr auto;gap:8px;font-size:24px;align-items:center}
#board .r{font-weight:700;color:var(--gold2);text-align:center}
#board li:first-child .n{color:var(--gold2);font-weight:600}
#board .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#board .p{font-variant-numeric:tabular-nums;color:var(--gold2)}
#board .empty{display:block;text-align:center;color:var(--muted);font-size:22px}
/* chant + gift banners float over the back rows, below the altar */
#chant{left:110px;right:110px;top:900px;padding:20px 28px;text-align:center;border-radius:24px;border:2px solid var(--gold);
  background:rgba(40,18,8,.88);opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s}
#chant.show{opacity:1;transform:none}
#chant h4{margin:0 0 8px;font-family:var(--display);color:var(--gold2);font-size:28px;letter-spacing:.1em}
#chant p{margin:0;font-family:var(--display);font-style:italic;font-size:30px;line-height:1.45}
#gift{left:80px;right:80px;top:900px;z-index:5;padding:26px 36px;text-align:center;border-radius:28px;border:3px solid var(--gold2);
  background:radial-gradient(ellipse at 50% 0%,rgba(150,40,20,.95),rgba(50,14,6,.95));box-shadow:0 0 60px rgba(255,190,90,.45);
  opacity:0;transform:scale(.85);transition:opacity .45s,transform .45s cubic-bezier(.2,1.4,.4,1)}
#gift.show{opacity:1;transform:none}
#gift .who{font-family:var(--display);font-weight:700;font-size:50px;color:var(--gold2)}
#gift .what{font-size:34px;margin-top:6px}
#gift .pray{font-family:var(--display);font-style:italic;font-size:30px;color:var(--fg);margin-top:12px;opacity:.95}
/* enable sound (needed once: browsers block autoplay) */
#unmute{position:absolute;z-index:9;left:50%;top:1440px;transform:translateX(-50%);font:600 36px var(--body);padding:22px 44px;border-radius:24px;border:3px solid var(--gold2);background:var(--red);color:#fff4dc;cursor:pointer}
#conn{position:absolute;z-index:4;left:16px;top:12px;font-size:20px;color:var(--muted);opacity:.7}
@media (prefers-reduced-motion:reduce){#chant,#gift{transition:none}.cnt.bump b,#ticker.flash{animation:none}}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="offer" class="panel ui">
    <div id="title">Chánh Điện Tịnh Tâm</div>
    <div id="subtitle">Nam Mô A Di Đà Phật</div>
    <div id="clock">60:00</div>
    <div class="lbl">KHÓA LỄ CÒN LẠI</div>
    <div class="cnt" id="c_incense"><img src="/assets/fx_incense.png" alt=""><b>0</b><span>Dâng hương</span></div>
    <div class="cnt" id="c_bow"><img src="/assets/fx_halo.png" alt=""><b>0</b><span>Lễ Phật</span></div>
    <div class="cnt" id="c_lotus"><img src="/assets/fx_lotus.png" alt=""><b>0</b><span>Hoa sen</span></div>
    <div class="cnt" id="c_likes"><span class="ic">♥</span><b>0</b><span>Thả tim</span></div>
    <div id="people"><b id="count">0</b> người đang lễ</div>
  </div>
  <div id="bar" class="ui">
    <div id="left">
      <div id="ticker"><b id="tkName">Nam Mô A Di Đà Phật</b><i id="tkWhat">tùy hỷ công đức</i></div>
      <div id="legend">
        <div class="lg panel"><img src="/assets/fx_incense.png" alt=""><div><small>1 COIN</small><span>Dâng hương</span></div></div>
        <div class="lg panel"><img src="/assets/fx_halo.png" alt=""><div><small>5 COINS</small><span>Lễ Phật</span></div></div>
        <div class="lg panel"><img src="/assets/fx_lotus.png" alt=""><div><small>10+ COINS</small><span>Hoa sen</span></div></div>
      </div>
    </div>
    <div id="board" class="panel"><h3>TẤM LÒNG THÀNH</h3><ol id="boardList"><li class="empty">Chưa có</li></ol></div>
  </div>
  <div id="chant" class="ui"><h4>✦ TỤNG KINH ĐỊNH KỲ ✦</h4><p id="chantText"></p></div>
  <div id="gift" class="ui"><div class="who" id="giftWho"></div><div class="what" id="giftWhat"></div><div class="pray" id="giftPray"></div></div>
  <button id="unmute">🔔 Bấm để bật âm thanh</button>
  <div id="conn">đang kết nối…</div>
</div></div>

<script>
/* ======================= stage fit ======================= */
const stage = document.getElementById('stage');
function fit(){ const s = Math.min(innerWidth/1080, innerHeight/1920); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();
const $ = id => document.getElementById(id);

/* ======================= assets ======================= */
const A = {};
const IMG = { hall:'/assets/grand_hall.jpg', abbot:'/assets/abbot.png', lotus:'/assets/fx_lotus.png', halo:'/assets/fx_halo.png', bell:'/assets/fx_bell.png', incense:'/assets/fx_incense.png', petal:'/assets/fx_petal.png' };
for (const [k,src] of Object.entries(IMG)){ const im=new Image(); im.src=src; A[k]=im; }
const FX_ICON = { incense:'incense', bow:'halo', lotus:'lotus' };
const avatars = new Map();
function avatar(url){ if(!url) return null; let im=avatars.get(url); if(!im){ im=new Image(); im.referrerPolicy='no-referrer'; im.src=url; avatars.set(url,im); } return im.naturalWidth?im:null; }

/* ======================= worshipper sprites ======================= */
// Small figures seen from behind, facing the Buddha. Painted once per outfit into offscreen canvases, then scaled per seat.
const SKINS = {
  man:    { robe:'#a7a3c4', dark:'#67628a', hair:'#2a211c' },
  woman:  { robe:'#9ea8cc', dark:'#5f6995', hair:'#1d1612', bun:true },
  granny: { robe:'#80563a', dark:'#4c301d', hair:'#bdb6ad', bun:true },
  monk:   { robe:'#c99a3c', dark:'#85601e' },
  nun:    { robe:'#9d9c99', dark:'#61605d' },
  child:  { robe:'#b8b2d2', dark:'#767096', small:true },
  master: { robe:'#de7d22', dark:'#93441a', sash:'#a8361a' },
};
const SKIN_C = '#e8c29b', SKIN_D = '#b4855e', RES = 1.6;     // RES: sprite pixels per unit, enough for the front row
function tint(hex, k){ const n=parseInt(hex.slice(1),16), f=c=>Math.round(c+(255-c)*k); return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`; }
function head(g, y, r, o){
  g.fillStyle=SKIN_D; g.fillRect(-r*.36, y+r*.5, r*.72, r*.75);                       // neck
  for (const s of [-1,1]){ g.beginPath(); g.ellipse(s*r*.96, y+r*.12, r*.24, r*.32, 0, 0, 6.29); g.fill(); }   // ears
  const gr=g.createRadialGradient(-r*.35, y-r*.4, r*.1, 0, y, r*1.05);
  gr.addColorStop(0, o.hair ? tint(o.hair,.25) : SKIN_C); gr.addColorStop(1, o.hair || SKIN_D);
  g.fillStyle=gr; g.beginPath(); g.arc(0, y, r, 0, 6.29); g.fill();
  if (o.bun){ g.fillStyle=o.hair; g.beginPath(); g.arc(0, y+r*.45, r*.5, 0, 6.29); g.fill(); g.fillStyle='rgba(255,255,255,.14)'; g.beginPath(); g.arc(-r*.15, y+r*.32, r*.2, 0, 6.29); g.fill(); }
  else if (!o.hair){ g.fillStyle='rgba(70,60,80,.18)'; g.beginPath(); g.arc(0, y, r, Math.PI*1.08, Math.PI*1.92); g.fill(); }   // shaved: faint stubble on the crown
}
function robeFolds(g, o, top, bottom, spread){
  g.strokeStyle=o.dark; g.globalAlpha=.5; g.lineWidth=2;
  for (const x of [-1,0,1]){ g.beginPath(); g.moveTo(x*spread*.35, top); g.quadraticCurveTo(x*spread*.75, (top+bottom)/2, x*spread, bottom-3); g.stroke(); }
  g.globalAlpha=1;
}
function paintKneel(o){
  const c=document.createElement('canvas'); c.width=110*RES; c.height=110*RES; const g=c.getContext('2d');
  g.scale(RES,RES); g.translate(55,104);                                               // origin: bottom centre
  g.fillStyle='rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(0,0,47,7,0,0,6.29); g.fill();
  const gr=g.createLinearGradient(-30,-70,30,0); gr.addColorStop(0,tint(o.robe,.22)); gr.addColorStop(1,o.dark);
  g.fillStyle=gr; g.beginPath(); g.moveTo(-44,-2); g.bezierCurveTo(-49,-30,-35,-58,-22,-66); g.quadraticCurveTo(0,-74,22,-66); g.bezierCurveTo(35,-58,49,-30,44,-2); g.quadraticCurveTo(0,5,-44,-2); g.fill();
  robeFolds(g, o, -62, 0, 30);
  if (o.sash){ g.fillStyle=o.sash; g.beginPath(); g.moveTo(-22,-66); g.lineTo(-8,-70); g.lineTo(40,-8); g.lineTo(26,-2); g.closePath(); g.fill(); }
  g.fillStyle='#3a2a20'; for (const s of [-1,1]){ g.beginPath(); g.ellipse(s*12,-2,8,4,0,0,6.29); g.fill(); }   // soles of the feet
  g.fillStyle=o.dark; g.beginPath(); g.ellipse(0,-67,12,5,0,0,6.29); g.fill();         // collar
  head(g, -81, 15, o);
  return c;
}
function paintWalk(o, step){
  const c=document.createElement('canvas'); c.width=90*RES; c.height=160*RES; const g=c.getContext('2d');
  g.scale(RES,RES); g.translate(45,154);
  g.fillStyle='rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(0,0,28,6,0,0,6.29); g.fill();
  g.fillStyle='#3a2a20'; g.beginPath(); g.ellipse(step?9:-9, -3, 7, 4, 0, 0, 6.29); g.fill();   // the foot that is down
  const sway = step ? 3 : -3;
  const gr=g.createLinearGradient(-24,-115,24,0); gr.addColorStop(0,tint(o.robe,.22)); gr.addColorStop(1,o.dark);
  g.fillStyle=gr; g.beginPath(); g.moveTo(-30+sway,-6); g.bezierCurveTo(-31,-50,-28,-96,-20,-112); g.quadraticCurveTo(0,-120,20,-112); g.bezierCurveTo(28,-96,31,-50,30+sway,-6); g.quadraticCurveTo(0,-1,-30+sway,-6); g.fill();
  g.fillStyle=o.dark; g.globalAlpha=.35; for (const s of [-1,1]){ g.beginPath(); g.ellipse(s*22,-80,7,26,s*.08,0,6.29); g.fill(); } g.globalAlpha=1;   // sleeves
  robeFolds(g, o, -105, -4, 22);
  if (o.sash){ g.fillStyle=o.sash; g.beginPath(); g.moveTo(-18,-112); g.lineTo(-6,-116); g.lineTo(28,-40); g.lineTo(18,-34); g.closePath(); g.fill(); }
  g.fillStyle=o.dark; g.beginPath(); g.ellipse(0,-113,11,4.5,0,0,6.29); g.fill();
  head(g, -127, 14, o);
  return c;
}
const SPR = {};
for (const [k,o] of Object.entries(SKINS)) SPR[k] = { kneel: paintKneel(o), walk: [paintWalk(o,0), paintWalk(o,1)] };

/* ======================= seats ======================= */
// Perspective of the painting: the carpet edges meet at y=376, the floor starts around y=830.
const VP = 376;
const depth = y => (y-VP)/1000;                       // 1 ≈ size of the front rows
const carpetHalf = y => .1936*(y-VP);
const UNIT = .66;                                     // sprite unit → px at depth 1
const SEATS = [];
(function buildSeats(){
  let y = 900, r = 0;
  while (y <= 1690){
    const k = depth(y), cg = 64*k, xin = 540 + carpetHalf(y) + .62*cg, xout = (y < 935 ? 955 : 1062) - .5*cg;   // pillars stand in the back corners
    const n = Math.floor((xout-xin)/cg) + 1;
    for (let i=0;i<n;i++) for (const side of [-1,1]) SEATS.push({ x: 540 + side*(xin-540+i*cg), y, k, r, i });
    r++; y += 54*k;
  }
  // fill outward from the middle of the floor, carpet side first, so a small crowd still reads as a full hall
  // and the last free seats are the far corners of the back rows rather than the front
  const focus = Math.round(r*.5);
  SEATS.sort((a,b) => (Math.abs(a.r-focus) + a.i*1.25) - (Math.abs(b.r-focus) + b.i*1.25) || a.y-b.y);
  SEATS.forEach((s,i) => s.idx = i);
})();
const taken = new Array(SEATS.length).fill(null);

const visitors = new Map();  // id -> visitor
function addVisitor(p, instant){
  const old = visitors.get(p.id);
  if (old){ Object.assign(old, { name:p.name, skin:p.skin, avatar:p.avatar, coins:p.coins }); return; }
  const si = taken.indexOf(null), seat = si >= 0 ? SEATS[si] : null;
  if (seat) taken[si] = p.id;
  const walking = [...visitors.values()].filter(v => v.state==='walk').length;
  const lane = Math.random()-.5;
  const v = { ...p, seat, state:'walk', x:540+lane*carpetHalf(1990)*.6, y:1990, lane, ft:0, step:0, fade:1, sitT:1,
              glow:0, bow:0, bubble:null, active: instant ? -1e9 : performance.now(), phase:Math.random()*6.28 };   // a newcomer's name shows for a while
  visitors.set(p.id, v);
  if (instant || !seat || walking > 10){ v.state='sit'; v.x=seat?.x ?? 540; v.y=seat?.y ?? 1500; v.fade=instant?1:0; }
}
function removeVisitor(id){ const v=visitors.get(id); if (v?.seat) taken[v.seat.idx]=null; visitors.delete(id); }

/* the abbot (painted sprite, larger than life so he reads on a phone) kneels at the head of the carpet, two teachers just behind him */
const TEACHERS = [ { name:'Thầy Minh Đạo', skin:'monk', x:458, y:858 }, { name:'Thầy Tâm Từ', skin:'monk', x:622, y:858 } ];
const ABBOT = { name:'Sư Trụ Trì', x:540, y:888, w:112 };

/* donors kneel closest to the Buddha: the biggest giver takes the front row by the carpet, the next one beside them, and so on */
const PRESTIGE = SEATS.map((s,i)=>i).sort((a,b) => SEATS[a].r-SEATS[b].r || SEATS[a].i-SEATS[b].i || SEATS[a].x-SEATS[b].x);
function moveTo(v, si, instant){
  v.seat = SEATS[si]; taken[si] = v.id;
  if (instant){ v.state='sit'; v.x=v.seat.x; v.y=v.seat.y; return; }
  if (v.state==='sit'){ v.state='walk'; v.lane=Math.random()-.5; }      // stands up: out to the carpet, along it, then into the row
}
function arrange(instant){
  const donors=[...visitors.values()].filter(v=>v.coins>0 && v.seat).sort((a,b)=>b.coins-a.coins || (a.id<b.id?-1:1));
  const reserved=new Set(PRESTIGE.slice(0,donors.length)), bumped=[];
  donors.forEach((v,j) => { v.rank=j; if (taken[v.seat.idx]===v.id) taken[v.seat.idx]=null; });
  for (const v of visitors.values()) if (!(v.coins>0) && v.seat && reserved.has(v.seat.idx)){ v.rank=Infinity; taken[v.seat.idx]=null; bumped.push(v); }
  donors.forEach((v,j) => { const si=PRESTIGE[j]; if (v.seat.idx===si){ taken[si]=v.id; } else moveTo(v, si, instant); });
  for (const v of bumped){ const si=taken.findIndex((id,i)=>id===null && !reserved.has(i)); if (si>=0) moveTo(v, si, instant); }
}

/* ======================= HUD ======================= */
let sessionEndsAt = Date.now() + 3600e3, topIds = new Set();
function updateCount(){ $('count').textContent = visitors.size; }
const fmt = n => n >= 10000 ? (n/1000).toFixed(n >= 100000 ? 0 : 1).replace('.', ',') + 'K' : String(n);
function setStats(st, bump){
  for (const k of ['incense','bow','lotus','likes']){
    const row = $('c_'+k), b = row.querySelector('b'), txt = fmt(st?.[k] || 0);
    if (b.textContent === txt) continue;
    b.textContent = txt;
    if (bump){ row.classList.remove('bump'); void row.offsetWidth; row.classList.add('bump'); }
  }
}
function setTop(top){
  const ol = $('boardList'); ol.textContent = ''; topIds = new Set((top||[]).map(d => d.id));
  if (!top?.length){ const li=document.createElement('li'); li.className='empty'; li.textContent='Chưa có'; ol.append(li); return; }
  top.forEach((d,i) => { const li=document.createElement('li');
    for (const [cls,txt] of [['r', i+1], ['n', d.name], ['p', fmt(d.coins)]]){ const s=document.createElement('span'); s.className=cls; s.textContent=txt; li.append(s); }
    ol.append(li); });
}
function setTicker(o, flash){
  if (!o) return; $('tkName').textContent = o.name; $('tkWhat').textContent = o.label;
  if (flash){ const el=$('ticker'); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}
setInterval(() => {
  const s = Math.max(0, Math.round((sessionEndsAt-Date.now())/1000)), p = x => String(Math.floor(x)).padStart(2,'0');
  $('clock').textContent = s >= 3600 ? `${Math.floor(s/3600)}:${p(s/60%60)}:${p(s%60)}` : `${p(s/60)}:${p(s%60)}`;
}, 500);
let giftHide=null;
function showGift(m){
  $('giftWho').textContent = m.name;
  $('giftWhat').textContent = `${m.label} · ${m.giftName}${m.count>1?' ×'+m.count:''} · công đức ${m.total}`;
  $('giftPray').textContent = '“' + m.prayer + '”';
  $('chant').classList.remove('show');
  const el=$('gift'); el.classList.add('show'); clearTimeout(giftHide); giftHide=setTimeout(()=>el.classList.remove('show'), m.tier>=3?9000:6500);
}
let chantHide=null;
function showChant(text){ $('chantText').textContent=text; const el=$('chant'); el.classList.add('show'); clearTimeout(chantHide); chantHide=setTimeout(()=>el.classList.remove('show'), 14000); }

/* ======================= audio ======================= */
let AC=null, master=null, musicGain=null, sfx=null, settings={ music:true, mo:true, moBpm:52 };
const TRACKS=['/assets/music/music1.mp3','/assets/music/music2.mp3']; let trackIdx=Math.floor(Math.random()*TRACKS.length), musicEl=null;
$('unmute').onclick = e => { e.currentTarget.remove(); startAudio(); };
function startAudio(){
  AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value=.9; master.connect(AC.destination);
  musicGain = AC.createGain(); musicGain.gain.value=settings.music?.5:0; musicGain.connect(master);
  sfx = AC.createGain(); sfx.gain.value=1; sfx.connect(master);
  nextTrack(); scheduleMo(); bell();
}
function nextTrack(){
  if (musicEl){ musicEl.pause(); }
  musicEl = new Audio(TRACKS[trackIdx++ % TRACKS.length]); const src=AC.createMediaElementSource(musicEl); src.connect(musicGain);
  musicEl.onended = nextTrack; musicEl.play().catch(()=>{});
}
function duck(on){ if(!musicGain) return; const t=AC.currentTime, target = !settings.music ? 0 : on ? .14 : .5; musicGain.gain.cancelScheduledValues(t); musicGain.gain.setValueAtTime(musicGain.gain.value,t); musicGain.gain.linearRampToValueAtTime(target,t+.5); }
let haloPulse=0;
function bell(big){
  haloPulse=1;
  if(!AC) return; const t=AC.currentTime, k=big?1.7:1;
  for (const [f,a,d] of [[216,.55,7],[432,.35,5],[1296,.12,3],[2160,.05,2]]) { const o=AC.createOscillator(); o.type='sine'; o.frequency.value=f*(big?.75:1); const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(a*k*.7,t+.015); g.gain.exponentialRampToValueAtTime(.0005,t+d*k); o.connect(g); g.connect(sfx); o.start(t); o.stop(t+d*k+.1); }
}
function mo(){
  if(!AC) return; const t=AC.currentTime;
  const o=AC.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(620,t); o.frequency.exponentialRampToValueAtTime(380,t+.05);
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=700; bp.Q.value=3; const g=AC.createGain(); g.gain.setValueAtTime(.35,t); g.gain.exponentialRampToValueAtTime(.001,t+.14);
  o.connect(bp); bp.connect(g); g.connect(sfx); o.start(t); o.stop(t+.16);
}
let moTimer=null; function scheduleMo(){ clearInterval(moTimer); if (AC && settings.mo) moTimer=setInterval(mo, 60000/Math.max(20,settings.moBpm||52)); }
// server-made voice lines play one after another
const ttsQ=[]; let ttsPlaying=false;
function queueTTS(url, onStart){ ttsQ.push({url,onStart}); playTTS(); }
function playTTS(){
  if (ttsPlaying || !ttsQ.length || !AC) return; ttsPlaying=true;
  const {url,onStart}=ttsQ.shift(); const el=new Audio(url); const src=AC.createMediaElementSource(el); const g=AC.createGain(); g.gain.value=1.25; src.connect(g); g.connect(master);
  el.onplay=()=>{ duck(true); onStart&&onStart(); }; el.onended=el.onerror=()=>{ duck(false); ttsPlaying=false; setTimeout(playTTS,350); };
  el.play().catch(()=>{ ttsPlaying=false; });
}

/* ======================= effects ======================= */
const fx=[], petals=[];
let rays=0, beam=0;          // Buddha's halo rays and the light column down to the incense burner, both fade out
function giftFx(v, tier, kind){
  rays = Math.max(rays, tier>=3 ? 1 : tier>=2 ? .75 : .4); if (tier>=2) beam = 1;
  if (!v) return;
  v.glow=1; v.bow=1; v.active=performance.now();
  const k=v.seat?.k || .8;
  fx.push({ kind: tier>=3 ? 'bell' : FX_ICON[kind] || 'incense', x:v.x, y:v.y-110*UNIT*k, t:0, life: tier>=3?3.4:2.4, scale: k*(tier>=3?.75:.55) });
  for (let i=0;i<(tier>=3?22:tier>=2?10:4);i++) petals.push({x:v.x+(Math.random()-.5)*100*k, y:v.y-60*k, vx:(Math.random()-.5)*40, vy:-(70+Math.random()*90), t:0, life:2.6+Math.random(), s:.1+Math.random()*.1});
  if (tier>=3){ bell(true); for (let i=0;i<30;i++) petals.push({x:540+(Math.random()-.5)*700, y:120+Math.random()*250, vx:(Math.random()-.5)*40, vy:30+Math.random()*50, t:0, life:5, s:.16+Math.random()*.12}); }
}
function hearts(v,n){ if (!v) return; const k=v.seat?.k || .8; for (let i=0;i<Math.min(6,n);i++) petals.push({x:v.x+(Math.random()-.5)*50*k, y:v.y-100*UNIT*k, vx:(Math.random()-.5)*20, vy:-(50+Math.random()*40), t:0, life:1.6, s:.08, heart:true, size:Math.max(18,34*k)}); }

/* ======================= server link ======================= */
let ws=null;
function connect(){
  ws = new WebSocket(`ws://${location.host}/ws?role=overlay`);
  const st=$('conn');
  ws.onopen=()=>{ st.textContent=''; };
  ws.onclose=()=>{ st.textContent='mất kết nối server… đang thử lại'; setTimeout(connect,2000); };
  ws.onmessage=e=>{
    const m=JSON.parse(e.data), now=performance.now();
    switch(m.t){
      case 'state':
        Object.assign(settings,m.settings); applySettings(); if (m.sessionEndsAt) sessionEndsAt=m.sessionEndsAt;
        visitors.clear(); taken.fill(null); for (const p of m.viewers) addVisitor(p,true); arrange(true);
        updateCount(); setStats(m.stats); setTop(m.top); setTicker(m.lastOffer); break;
      case 'settings': Object.assign(settings,m.settings); applySettings(); break;
      case 'join': addVisitor(m.v, m.v.demo && visitors.size>8); if (m.v.coins>0) arrange(); updateCount(); break;
      case 'leave': { const was=visitors.get(m.id)?.coins>0; removeVisitor(m.id); if (was) arrange(); updateCount(); } break;
      case 'skin': { const v=visitors.get(m.id); if(v){ v.skin=m.skin; v.glow=.8; v.active=now; } } break;
      case 'chat': { const v=visitors.get(m.id); if(v){ v.bubble={text:m.text, at:now, until:now+6000}; v.bow=.6; v.active=now; } } break;
      case 'gift': { const v=visitors.get(m.id); if(v) v.coins=m.total; giftFx(v,m.tier,m.kind); arrange(); setStats(m.stats,true); setTop(m.top); setTicker({name:m.name,label:m.label},true); showGift(m); } break;
      case 'stats': setStats(m.stats,true); break;
      case 'session': sessionEndsAt=m.endsAt; break;
      case 'like': hearts(visitors.get(m.id),m.n); break;
      case 'tts': queueTTS(m.url); break;
      case 'chant': showChant(m.text); bell(); break;
      case 'bell': bell(true); rays=Math.max(rays,.5); break;
      case 'mo1': mo(); break;
    }
  };
}
function applySettings(){
  $('title').textContent=settings.title||'Chánh Điện Tịnh Tâm';
  $('subtitle').textContent=settings.subtitle||'Nam Mô A Di Đà Phật';
  duck(false); scheduleMo();
}
connect();

/* ======================= render ======================= */
const ctx=$('c').getContext('2d');
function sprite(im,x,y,s,ay=1){ if(!im?.naturalWidth) return; const w=im.naturalWidth*s,h=im.naturalHeight*s; ctx.drawImage(im,x-w/2,y-h*ay,w,h); }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function tag(text,x,y,fs,gold,av){
  ctx.font=`600 ${fs}px "Be Vietnam Pro",system-ui,sans-serif`;
  let t=text; while (t.length>2 && ctx.measureText(t).width>fs*8) t=t.slice(0,-1); if (t!==text) t=t.trimEnd()+'…';
  const pad=fs*.45, aw=av?fs*1.1:0, w=ctx.measureText(t).width+pad*2+aw, h=fs*1.45;
  ctx.fillStyle = gold?'rgba(70,30,8,.92)':'rgba(14,8,5,.74)'; rr(x-w/2,y-h/2,w,h,h/2); ctx.fill();
  ctx.lineWidth = gold?2.5:1.2; ctx.strokeStyle = gold?'#e2b04f':'rgba(226,176,79,.45)'; ctx.stroke();
  if (av){ ctx.save(); ctx.beginPath(); ctx.arc(x-w/2+pad*.5+aw/2, y, fs*.48, 0, 6.29); ctx.clip(); ctx.drawImage(av, x-w/2+pad*.5+aw/2-fs*.48, y-fs*.48, fs*.96, fs*.96); ctx.restore(); }
  ctx.fillStyle = gold?'#ffd98a':'#f6e9cf'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t, x+aw/2, y+1);
}
function bubble(text,x,y,placed){
  const fs=30; ctx.font=`700 ${fs}px "Be Vietnam Pro",system-ui,sans-serif`;
  const lines=[]; let cur='';                                   // wrap to two lines of at most 400px
  for (const w of String(text).split(/\s+/)){ const n=cur?cur+' '+w:w; if (ctx.measureText(n).width>400 && cur){ lines.push(cur); cur=w; } else cur=n; if (lines.length===2) break; }
  if (lines.length<2 && cur) lines.push(cur);
  if (lines.length===2 && ctx.measureText(lines[1]).width>400){ let s=lines[1]; while (s.length>2 && ctx.measureText(s+'…').width>400) s=s.slice(0,-1); lines[1]=s+'…'; }
  const w=Math.max(...lines.map(l=>ctx.measureText(l).width))+fs*1.1, lh=fs*1.25, h=lh*lines.length+fs*.6;
  const bx=Math.max(16, Math.min(1064-w, x-w/2)); let by=y-h-12, tail=true;
  for (let moved=true, n=0; moved && n<8; n++){ moved=false;          // newer bubbles step up over older ones instead of covering them
    for (const p of placed) if (bx<p.x+p.w && bx+w>p.x && by<p.y+p.h+6 && by+h+6>p.y){ by=p.y-h-8; moved=true; tail=false; } }
  placed.push({x:bx,y:by,w,h});
  ctx.fillStyle='rgba(16,9,5,.86)'; rr(bx,by,w,h,14); ctx.fill();
  if (tail){ ctx.beginPath(); ctx.moveTo(x-10,by+h); ctx.lineTo(x+10,by+h); ctx.lineTo(x,by+h+12); ctx.fill(); }
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  lines.forEach((l,i)=>ctx.fillText(l, bx+w/2, by+fs*.3+lh*(i+.5)+1));
}
function figure(skin, x, y, k, state, step, extra){
  const sp = SPR[skin] || SPR.man, sc = UNIT*k*(SKINS[skin]?.small ? .8 : 1);
  if (state==='walk'){ const im=sp.walk[step]; ctx.drawImage(im, x-45*sc, y-154*sc-extra, 90*sc, 160*sc); return 140*sc; }
  ctx.drawImage(sp.kneel, x-55*sc, y-104*sc-extra, 110*sc, 110*sc); return 96*sc;
}
function glow(x,y,r,a){ ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=a; const g=ctx.createRadialGradient(x,y,4,x,y,r); g.addColorStop(0,'rgba(255,205,120,.95)'); g.addColorStop(1,'rgba(255,160,60,0)'); ctx.fillStyle=g; ctx.fillRect(x-r,y-r,r*2,r*2); ctx.restore(); }
const smoke = Array.from({length:18}, (_,i) => i/18);
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame); const dt=Math.max(0,Math.min((now-last)/1000,.05)); last=Math.max(last,now); const t=now/1000;
  ctx.clearRect(0,0,1080,1920);
  if (A.hall.naturalWidth) ctx.drawImage(A.hall,0,0,1080,1920);
  // halo behind the Buddha's head, rays after a gift, a light column down to the burner for bigger gifts
  haloPulse=Math.max(0,haloPulse-dt*.4); rays=Math.max(0,rays-dt*.14); beam=Math.max(0,beam-dt*.22);
  glow(540,170,230,.2+.06*Math.sin(t*1.2)+haloPulse*.35);

    const g=ctx.createRadialGradient(0,0,50,0,0,560); g.addColorStop(0,'rgba(255,225,140,.95)'); g.addColorStop(1,'rgba(255,200,90,0)'); ctx.fillStyle=g;
    for (let i=0;i<28;i++){ ctx.rotate(Math.PI*2/28); ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,560,-.04,.04); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  }

    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=beam*.55;
    const g=ctx.createLinearGradient(0,200,0,800); g.addColorStop(0,'rgba(255,220,130,.9)'); g.addColorStop(1,'rgba(255,190,80,0)'); ctx.fillStyle=g;
    ctx.beginPath(); ctx.moveTo(512,200); ctx.lineTo(568,200); ctx.lineTo(610,800); ctx.lineTo(470,800); ctx.closePath(); ctx.fill(); ctx.restore();

  // teachers and the abbot at the head of the carpet
  for (const tc of TEACHERS) figure(tc.skin, tc.x, tc.y, depth(tc.y), 'sit', 0, 0);
  if (A.abbot.naturalWidth){
    const w=ABBOT.w, h=w*A.abbot.naturalHeight/A.abbot.naturalWidth, breathe=1+.006*Math.sin(t*1.1);
    glow(ABBOT.x, ABBOT.y-h*.55, h*1.1, .32+.08*Math.sin(t*1.5));

  for (const v of list){
    const s=v.seat;
    if (v.state==='walk'){
      const sp=240*depth(v.y)*dt, dy=s.y-v.y, lane=540+v.lane*carpetHalf(v.y)*.6;
      if (Math.abs(dy)>2 && Math.abs(lane-v.x)>8) v.x+=Math.sign(lane-v.x)*Math.min(Math.abs(lane-v.x), sp*1.1);    // out of the row onto the carpet
      else if (Math.abs(dy)>2){ v.y+=Math.sign(dy)*Math.min(Math.abs(dy), sp); v.x=540+v.lane*carpetHalf(v.y)*.6; }  // along the carpet
      else { const dx=s.x-v.x; v.y=s.y; v.x+=Math.sign(dx)*Math.min(Math.abs(dx), sp*1.1); if (Math.abs(dx)<1.5){ v.x=s.x; v.state='sit'; v.sitT=0; } }   // then into the row
      v.ft+=dt; if (v.ft>.2){ v.ft=0; v.step^=1; }
    } else v.sitT=Math.min(1,v.sitT+dt*2.5);
    v.fade=Math.min(1,v.fade+dt*2); v.glow=Math.max(0,v.glow-dt*.45); v.bow=Math.max(0,v.bow-dt*.7);
    const k=depth(v.y);
    if (v.glow>0 || v.skin==='master') glow(v.x, v.y-45*k, 75*k, Math.max(v.glow*.4, v.skin==='master'?.22+.06*Math.sin(t*1.6):0));   // the floor is bright already: keep it soft
    ctx.save(); ctx.globalAlpha=v.fade;

    if (bowK){ ctx.translate(v.x,v.y); ctx.scale(1,1-bowK); ctx.translate(-v.x,-v.y); }
    const lift = v.state==='walk' ? Math.abs(Math.sin(t*10+v.phase))*2.5*k : (1-v.sitT)*8*k + Math.sin(t*1.1+v.phase)*.8*k;

    if (showAll || now-v.active<25000 || v.rank<10) labels.push([v.rank<10 ? now+1e6-v.rank : v.active, v.name, v.x, ty, fs, v.coins>=99 || topIds.has(v.id), avatar(v.avatar)]);   // top-10 donors always named, drawn on top
    if (v.bubble && now<v.bubble.until) talk.push([v.bubble.at, v.bubble.text, v.x, ty-fs*.8]); else v.bubble=null;
  }
  labels.sort((a,b)=>a[0]-b[0]).forEach(l=>tag(...l.slice(1)));
  const placed=[]; talk.sort((a,b)=>a[0]-b[0]).slice(-6).forEach(b=>bubble(...b.slice(1), placed));
  // gift icons rising, petals / hearts
  for (let i=fx.length-1;i>=0;i--){ const f=fx[i]; f.t+=dt; const k=f.t/f.life; if(k>=1){ fx.splice(i,1); continue; } const pop=1-Math.pow(1-Math.min(1,f.t*4),3);
    ctx.save(); ctx.globalAlpha=k<.75?1:(1-k)/.25; sprite(A[f.kind],f.x,f.y-k*150,f.scale*(.6+.4*pop)); ctx.restore(); }
  for (let i=petals.length-1;i>=0;i--){ const p=petals[i]; p.t+=dt; if(p.t>p.life){ petals.splice(i,1); continue; } p.x+=p.vx*dt+Math.sin(p.t*3+i)*20*dt; p.y+=p.vy*dt;

    ctx.restore(); }
}
